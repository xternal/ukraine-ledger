status_note:
  en: On 10 December 2024 the Treasury moved the $20bn to a World Bank fund (the F.O.R.T.I.S. Ukraine FIF), through which it is to be made available to Ukraine. As of July 2025 the World Bank had paid $4.64bn of this money to Ukraine through its PEACE project, according to the US Government Accountability Office.
