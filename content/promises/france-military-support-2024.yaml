status_note:
  en: "On 15 October 2024 the Armed Forces Minister told a Senate committee that French aid in 2024 would be between €2bn and €3bn, closer to €3bn. In an answer to the National Assembly published on 24 October 2024, he said more than €2bn had actually been used by early October. No final figure for 2024 was found by 20 October 2026; the ministry counts €5.9bn of direct military support from 24 February 2022 to 31 December 2024."
