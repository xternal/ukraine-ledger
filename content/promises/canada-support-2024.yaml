status_note:
  en: "Ukraine received C$2.4bn of loans from Canada in 2024: C$2bn in March and C$400m in October. National Defence puts Canada’s military assistance to Ukraine at C$1.184bn in its 2024–25 financial year, April 2024 to March 2025. Together that is more than the C$3.02bn, but the military figure is not split by calendar year, so how much of it arrived in 2024 is unconfirmed."
