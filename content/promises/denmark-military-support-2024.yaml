  en: "“billon” is as written in the agreement. In April 2024 the three governing parties and six others in Parliament agreed to add DKK 4.4bn (about €590m), raising the 2024 frame for military support from DKK 13.9bn to DKK 18.3bn in 2024 prices (about €1.86bn to €2.45bn). A frame is a budget, and money left unspent is written off; no figure for what was spent in 2024 was found by 20 October 2026."
