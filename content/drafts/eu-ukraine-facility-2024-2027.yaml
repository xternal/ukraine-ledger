format: openpromises/1
id: eu-ukraine-facility-2024-2027
headline:
  en: €50bn Ukraine Facility for 2024 to 2027
actor_id: european-union
made_on: "2024-02-29"
venue: parliament
venue_label:
  en: Regulation (EU) 2024/792 establishing the Ukraine Facility, Article 6(3)
area: money_and_deals
status: delivering
status_note:
  en: The Commission had paid €29.5bn under Pillar I (pre-financing, bridge financing and seven regular payments) before an eighth payment of €2.9bn on 2 October 2026. Of the €50bn, up to €33bn is loans and up to €17bn non-repayable support, much of which pays for guarantees and interest subsidies rather than grants.
