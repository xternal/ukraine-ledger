status_note:
  en: "The agreement counts 44 packages by July 2024. Ukraine’s ambassador said the 45th was still being delivered in December 2024, and the Defence Minister said in February 2025 that a 46th, worth over €200m, was being prepared. Poland does not publish what its packages contain. The agreement is published as a scan: its words were read by machine (OCR) and checked against the page images."
