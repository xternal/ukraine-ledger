versions:
  - version: 1
    text: With a view to supporting Ukraine’s current and future needs in the face of a prolonged defense against Russia, the G7 will launch Extraordinary Revenue Acceleration (ERA) Loans for Ukraine, in order to make available approximately USD 50 billion in additional funding to Ukraine by the end of the year.
    recorded_on: "2026-10-20"
