id: g7-era-loans-2024
headline:
  en: About $50bn for Ukraine by end of 2024
actor_id: g7
made_on: "2024-06-14"
venue: summit
venue_label:
  en: Apulia G7 Leaders’ Communiqué, 14 June 2024
area: money_and_deals
status: delivering
status_note:
  en: Only the United States moved its share in 2024, on 10 December, into a World Bank fund; the EU paid its first €3bn on 10 January 2025, and the UK and Canada theirs in March 2025. By 13 November 2025 the Commission counted €30.9bn of the loans paid out. Each lender’s share has its own card, and only those cards count in the totals and the charts.
