versions:
  - version: 1
    text: Japan contributes to supporting Ukraine through providing Ukraine with a yen loan of 471.9 billion yen through a World Bank Financial Intermediary Fund, under the Extraordinary Revenue Acceleration (ERA) Loan initiative for Ukraine, which was agreed by the G7 Leaders last year and is to be repaid by future flows of extraordinary revenues stemming from immobilized Russian sovereign assets.
