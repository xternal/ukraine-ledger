status_note:
  en: "€19.8bn had been paid by 14 October 2026: €3.2bn of macro-financial assistance, €15.8bn for defence procurement and €800m through the Ukraine Facility. The loan is enhanced cooperation of 24 member states; Czechia, Hungary and Slovakia are not part of it."
